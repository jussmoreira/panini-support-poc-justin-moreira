put:
  summary: Update ticket priority
  description: Changes the priority of a specific ticket. The list automatically reorders by priority.
  operationId: updateTicketPriority
  tags:
    - Tickets
  parameters:
    - name: id
      in: path
      required: true
      description: Unique ticket identifier.
      schema:
        type: string
        example: "TKT-A1B2"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/UpdatePriorityRequest.yaml"
  responses:
    "200":
      description: Priority updated successfully. Returns the updated ticket.
      content:
        application/json:
          schema:
            $ref: "../schemas/Ticket.yaml"
    "404":
      description: Ticket not found.
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
